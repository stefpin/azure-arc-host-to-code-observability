# minibank-transfer settings. ${NAME:default} = environment variable NAME, or the default after ':'.
# The environment variables are set in openshift/10-deployment.yaml.
spring.application.name=minibank-transfer
server.port=8080

# Oracle Free (container minibank-oracle on APP-RHEL, PDB FREEPDB1, user MINIBANK)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//192.168.110.32:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:MINIBANK}
# no default on purpose: the password comes from the Secret minibank-transfer-secrets
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# minibank-fraud (Python FastAPI on APP-RHEL port 8082)
fraud.url=${FRAUD_URL:http://192.168.110.32:8082}

# Actuator: /actuator/health (+ /liveness and /readiness for the OpenShift probes) and /actuator/info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# minibank-rates (Java fee and limit check on OpenShift, Priority 1 feature B). 2 s budget, then fallback.
rates.url=${RATES_URL:http://minibank-rates.minibank.svc.cluster.local:8080}
