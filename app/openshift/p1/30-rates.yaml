# minibank-rates: Java fee and limit check in the payment path. NO agent in the image: the operator injects it (annotation below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minibank-rates
  namespace: minibank
  labels: {app: minibank-rates, demo: minibank}
spec:
  replicas: 2
  selector:
    matchLabels: {app: minibank-rates}
  template:
    metadata:
      labels: {app: minibank-rates}
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"     # <- the only monitoring setting
    spec:
      imagePullSecrets:
        - name: acr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: minibank-rates}
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
      containers:
        - name: minibank-rates
          image: ACR_NAME.azurecr.io/minibank-rates:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: JAVA_TOOL_OPTIONS              # heap = half of the memory limit; the operator appends -javaagent here
              value: "-XX:MaxRAMPercentage=50"
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: minibank-rates
  namespace: minibank
  labels: {app: minibank-rates, demo: minibank}
spec:
  selector: {app: minibank-rates}
  ports:
    - {name: http, port: 8080, targetPort: 8080, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: minibank-rates
  namespace: minibank
  labels: {app: minibank-rates, demo: minibank}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: minibank-rates}
